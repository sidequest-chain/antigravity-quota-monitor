[package]
name = "antigravity-quota-monitor"
version = "0.1.0"
description = "Real-time Quota & Usage Monitor Widget for Google Antigravity CLI and IDE"
authors = ["sidequest-chain <162595533+sidequest-chain@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/sidequest-chain/antigravity-quota-monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
dirs = "7"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
